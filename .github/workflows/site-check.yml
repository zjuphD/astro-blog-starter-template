name: Site Check

on:
  push:
    branches: [main, feature/ai-for-science-briefing]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # headline face is a subset of the display copy; fails if a headline gained a character it lacks
      - run: npm run check:font
      - run: npm run build
