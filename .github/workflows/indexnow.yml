name: IndexNow

# Tells IndexNow engines (Bing — which also feeds ChatGPT search, Copilot and
# DuckDuckGo — plus Yandex, Seznam, Naver) that pages changed, instead of waiting
# for a crawl. The key file is public/deef00b064983d1c58c272d2aa5a59bb.txt.
on:
  push:
    branches: [main]
    paths: ["src/**", "public/**", "astro.config.mjs"]
  schedule:
    - cron: "30 3 * * *" # daily, after the briefing bot's commit (bot pushes don't trigger push workflows)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for the Cloudflare deploy
        if: github.event_name == 'push'
        run: sleep 240
      - name: Submit URLs
        run: |
          body='{"host":"bioseeki.com","key":"deef00b064983d1c58c272d2aa5a59bb","keyLocation":"https://bioseeki.com/deef00b064983d1c58c272d2aa5a59bb.txt","urlList":["https://bioseeki.com/","https://bioseeki.com/en","https://bioseeki.com/briefing","https://bioseeki.com/privacy","https://bioseeki.com/llms.txt"]}'
          code=$(curl -sS -o /dev/stderr -w "%{http_code}" -X POST https://api.indexnow.org/indexnow -H "Content-Type: application/json; charset=utf-8" -d "$body")
          echo "IndexNow HTTP $code"
          # 200/202 accepted; 403 means the key file isn't reachable yet
          case "$code" in 200|202) ;; *) exit 1 ;; esac
