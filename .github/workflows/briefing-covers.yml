name: Briefing Source Covers

on:
  push:
    branches: [main]
    paths:
      - "src/data/briefings.json"
      - "scripts/capture-briefing-covers.mjs"
      - ".github/workflows/briefing-covers.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: briefing-source-covers
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright + Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture only missing source pages
        env:
          REFRESH_EXISTING: "0"
        run: node scripts/capture-briefing-covers.mjs

      - name: Commit new covers
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- public/briefing-covers)" ]; then
            echo "No new source covers."
            exit 0
          fi
          git config user.name "aiseeki-briefing-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/briefing-covers
          git commit -m "assets: add briefing source covers"
          git pull --rebase origin main
          git push origin HEAD:main
