name: Daily AI for Science Briefing V2

on:
  schedule:
    - cron: "30 23 * * *" # target 07:30 Asia/Shanghai; GitHub schedules may be delayed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-ai-for-science-briefing
  cancel-in-progress: true

jobs:
  update-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Collect, filter and rank research
        env:
          BRIEFING_AI_URL: ${{ secrets.BRIEFING_AI_URL }}
          BRIEFING_AI_KEY: ${{ secrets.BRIEFING_AI_KEY }}
          BRIEFING_AI_MODEL: ${{ secrets.BRIEFING_AI_MODEL }}
        run: |
          node scripts/update-briefing.mjs
          if [ -n "$BRIEFING_AI_URL" ] && [ -n "$BRIEFING_AI_KEY" ] && [ -n "$BRIEFING_AI_MODEL" ]; then
            echo "### AI editor: enabled" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### AI editor: disabled — V2 rule-based filtering is active" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Detect briefing changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- src/data/briefings.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new briefing items today." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install site dependencies
        if: steps.changes.outputs.changed == 'true'
        run: npm ci

      - name: Install Playwright + Chromium
        if: steps.changes.outputs.changed == 'true'
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture missing source covers
        if: steps.changes.outputs.changed == 'true'
        env:
          REFRESH_EXISTING: "0"
        run: node scripts/capture-briefing-covers.mjs

      - name: Build site before publishing
        if: steps.changes.outputs.changed == 'true'
        run: npm run build

      - name: Publish directly to main
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "aiseeki-briefing-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/briefings.json public/briefing-covers
          git commit -m "content: publish Aiseeki Daily $(date -u +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "### Published automatically to main" >> "$GITHUB_STEP_SUMMARY"
