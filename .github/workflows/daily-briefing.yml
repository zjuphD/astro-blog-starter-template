name: Daily AI for Science Briefing

on:
  schedule:
    - cron: "30 23 * * *" # 07:30 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare bot branch
        run: git checkout -B bot/daily-briefing

      - name: Collect and rank new research
        env:
          BRIEFING_AI_URL: ${{ secrets.BRIEFING_AI_URL }}
          BRIEFING_AI_KEY: ${{ secrets.BRIEFING_AI_KEY }}
          BRIEFING_AI_MODEL: ${{ secrets.BRIEFING_AI_MODEL }}
        run: node scripts/update-briefing.mjs

      - name: Commit update
        id: commit
        shell: bash
        run: |
          if git diff --quiet -- src/data/briefings.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "aiseeki-briefing-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/briefings.json
          git commit -m "content: update daily AI for Science briefing"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push bot branch
        if: steps.commit.outputs.changed == 'true'
        run: git push --force origin HEAD:bot/daily-briefing

      - name: Open or refresh review PR
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          PR=$(gh pr list --head bot/daily-briefing --base main --state open --json number --jq '.[0].number // empty')
          if [ -z "$PR" ]; then
            gh pr create \
              --base main \
              --head bot/daily-briefing \
              --title "每日前沿快讯更新" \
              --body $'Aiseeki 自动筛选了近期 AI for Science / 生物医学研究并更新快讯数据。\n\n请重点检查：\n- 标题和摘要是否忠于原文\n- 是否把 preprint、动物实验或体外结果夸大为临床结论\n- 分类和 AISK 分数是否合理\n- 原始来源链接是否正确\n\n确认后 Merge 即可发布。'
          else
            gh pr edit "$PR" --title "每日前沿快讯更新" --body $'Aiseeki 自动刷新了近期科研候选条目。请核对原始来源、证据类型、中文摘要与科研意义后再合并。'
          fi
